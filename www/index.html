<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Home Hub</title>
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">LOCAL CONTROL</div>
        <h1>Home Hub</h1>
      </div>
      <div id="status" class="status">Connecting…</div>
    </header>

    <section class="summary">
      <div class="metric"><span id="entityCount">—</span><small>entities</small></div>
      <div class="metric"><span id="lightCount">—</span><small>lights on</small></div>
      <div class="metric"><span id="lightTotal">—</span><small>total lights</small></div>
    </section>

    <section>
      <div class="section-title">
        <div>
          <div class="eyebrow">FLOOR PLAN</div>
          <h2>Tap a room</h2>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </div>

      <div class="floorplan-card">
        <div class="floorplan-shell">
          <img src="static/floorplan.jpg" alt="Home floor plan" />
          <div id="roomLayer" class="room-layer"></div>
        </div>
      </div>

      <div id="roomPanel" class="room-panel">
        <div class="room-empty">Tap a room to see its lights.</div>
      </div>

      <div id="unmappedAreas" class="area-mapping"></div>
    </section>

    <details>
      <summary>Diagnostics / entity browser</summary>
      <div class="section-title" style="margin-top:14px">
        <h2>Entities</h2>
        <input id="search" placeholder="Search entity or friendly name…" />
      </div>
      <div id="entities" class="entity-list"></div>
    </details>
  </main>

  <script src="static/app.js"></script>
</body>
</html>
